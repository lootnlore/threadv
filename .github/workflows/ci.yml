name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The brand (site.config.mjs reads SITE_NAME), the same in every job: the
# tests compare it with the committed social card, the deploy builds with it.
env:
  SITE_NAME: ${{ vars.SITE_NAME }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      # Every page must be valid HTML (rules in .htmlvalidate.json).
      - run: npx --yes html-validate@11 "dist/**/*.html"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright-core@1
      - run: npm run test:e2e
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome

  # The paid spreadsheet: its fee, payout and profit formulas must match the
  # website engine to the cent, and its features must survive LibreOffice.
  tracker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc-nogui
      - run: pip install openpyxl
      - run: python3 product/verify_tracker.py

  # Auto-deploys main to the VPS once you opt in. See README > "Automatic deploys".
  deploy:
    needs: [test, e2e] # the spreadsheet isn't part of the site, so deploys don't wait for it
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "::error::Set the VPS_SSH_KEY and VPS_KNOWN_HOSTS secrets (see README > Automatic deploys)."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy
        env:
          SKIP_TESTS: 1
          STRICT_HOST_KEYS: 1
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          SITE_URL: ${{ vars.SITE_URL }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          TRACKER_CHECKOUT_URL: ${{ vars.TRACKER_CHECKOUT_URL }}
          NEWSLETTER_ACTION: ${{ vars.NEWSLETTER_ACTION }}
          PLAUSIBLE_DOMAIN: ${{ vars.PLAUSIBLE_DOMAIN }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::warning::SITE_URL is not set; using the url in site.config.mjs."
          fi
          ./deploy/deploy.sh
