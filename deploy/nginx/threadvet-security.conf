# Security headers for every ThreadVet response. Installed to
# /etc/nginx/snippets/threadvet-security.conf. The page's own
# Content-Security-Policy <meta> tag covers scripts, styles and forms;
# frame-ancestors can only be sent as a header, so it lives here.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
# Turn on after HTTPS works for the domain AND www (setup-vps.sh does this for you):
# add_header Strict-Transport-Security "max-age=31536000" always;
