# ThreadVet nginx site. deploy/setup-vps.sh installs this as
# /etc/nginx/sites-available/threadvet with your domain substituted for
# threadvet.com, then certbot adds HTTPS and the http -> https redirect to
# both server blocks.

# One canonical host: www redirects to the apex. It is its own server so the
# redirect carries the security headers too (HSTS must cover www as well).
server {
    listen 80;
    listen [::]:80;
    server_name www.threadvet.com;
    server_tokens off;
    access_log /var/log/threadvet/access.log;
    error_log /var/log/threadvet/error.log;
    include snippets/threadvet-security.conf;
    return 301 $scheme://threadvet.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name threadvet.com;

    root /var/www/threadvet/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;

    # Own folder and rotation (deploy/logrotate/threadvet): the privacy policy
    # promises 14 days, so it can't depend on the distro's nginx default.
    access_log /var/log/threadvet/access.log;
    error_log /var/log/threadvet/error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css text/javascript application/javascript application/json
               application/manifest+json image/svg+xml application/xml text/plain;

    error_page 404 /404.html;

    # HTML pages: always revalidate so a deploy shows up immediately.
    location / {
        include snippets/threadvet-security.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # Icons and the social image: cache for a week.
    location /assets/ {
        include snippets/threadvet-security.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Content-hashed CSS/JS (app.3f2a9c1b7e.js): a name always means the same
    # bytes, so browsers may keep them forever.
    location ~ "^/assets/[a-z]+\.[0-9a-f]{10}\.(js|css)$" {
        include snippets/threadvet-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The service worker must never be cached, or updates get stuck.
    location = /sw.js {
        include snippets/threadvet-security.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.webmanifest {
        include snippets/threadvet-security.conf;
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /404.html {
        include snippets/threadvet-security.conf;
        internal;
    }

    # Standard metadata and ACME challenges live here; allow it before the dotfile rule.
    location ^~ /.well-known/ {
        include snippets/threadvet-security.conf;
        try_files $uri =404;
    }

    # Never serve other dotfiles (.git, .env, ...).
    location ~ /\. {
        include snippets/threadvet-security.conf;
        deny all;
    }
}
